name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: typecheck · lint · test · coverage · build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests with coverage (threshold 80%)
        run: npm run coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json

      - name: Build
        run: npm run build

      - name: Package hygiene (publint)
        run: npm run publint

      - name: NodeNext consumer smoke (import built ESM)
        run: node --input-type=module -e "import('./lib/index.js').then(m => { if (typeof m.apply !== 'function' || m.name !== 'github-reviewer') process.exit(1) })"
