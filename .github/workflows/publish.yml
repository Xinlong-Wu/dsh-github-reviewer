name: Publish

# Publish the tagged commit to the npm registry.
# Triggered by any tag matching a version format, e.g. v0.1.0-rc1, v0.1.0.
# The package.json version must exactly equal the tag without the leading 'v';
# otherwise the run fails fast and nothing is published.
#
# Prerequisite: set the repository secret NODE_AUTH_TOKEN to an npm automation
# or granular access token allowed to create and publish the public unscoped
# package `dsh-github-reviewer`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # for the post-publish GitHub release
  id-token: write # for npm publish --provenance (OIDC)

jobs:
  publish:
    name: verify · build · publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Validate tag format (vX.Y.Z[-prerelease])
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag (expected e.g. v0.1.0-rc1)"
            exit 1
          fi

      - name: Verify package identity and version
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          ACTUAL_NAME="$(node -p "require('./package.json').name")"
          if [ "$ACTUAL_NAME" != "dsh-github-reviewer" ]; then
            echo "::error::package.json name is '$ACTUAL_NAME', expected 'dsh-github-reviewer'."
            exit 1
          fi
          if [ "$EXPECTED_VERSION" != "$ACTUAL_VERSION" ]; then
            echo "::error::package.json version is '$ACTUAL_VERSION' but tag is '$GITHUB_REF_NAME'. Bump package.json to '$EXPECTED_VERSION' before tagging."
            exit 1
          fi
          echo "PKG_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests with coverage (threshold 80%)
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Verify DSH bundle package
        run: |
          node -e "const p=require('./package.json'); if (p.name !== 'dsh-github-reviewer' || p.dsh?.bundle?.patch !== './cordis.patch.yml') process.exit(1)"
          test -f cordis.patch.yml
          npm pack --dry-run --json > pack-dry-run.json
          node -e "const r=require('./pack-dry-run.json'); if (!r[0].files.some(f => f.path === 'cordis.patch.yml')) process.exit(1)"
          rm pack-dry-run.json

      - name: Package hygiene (publint)
        run: npm run publint

      - name: Dry-run publish (inspect tarball)
        run: npm publish --dry-run --provenance

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        # Every release — rc or stable — publishes to the default "latest"
        # dist-tag so plain `npm install` always gets the newest build.
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$PKG_VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG \
          || echo "::notice::Release $GITHUB_REF_NAME already exists, skipping"
